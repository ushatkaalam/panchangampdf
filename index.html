<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Categories of documentation</title>

<script src="docs.js" defer></script>

<style>

body
{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
}

h1
{
    text-align:center;
}

button
{
    width:180px;
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}


#categoryButtons
{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:25px;
}

.category
{
    min-width:160px;
}

.active
{
    background:#1976d2;
    color:white;
    font-weight:bold;
}

#pdfButtonContainer
{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}
.pdfSelected
{
    background:#90caf9;
    font-weight:bold;
}
#categoryHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-bottom:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}

      .categoryA
{
    background:#E3F2FD;
    color:#0D47A1;
}

.categoryB
{
    background:#E8F5E9;
    color:#1B5E20;
}

.categoryC
{
    background:#FFF8E1;
    color:#E65100;
}

.categoryD
{
    background:#F3E5F5;
    color:#4A148C;
}
#documentHeader
{
    background:#f2f2f2;
    border:1px solid #c0c0c0;
    padding:12px;
    margin-top:25px;
    margin-bottom:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
}

</style>

</head>

<body>

<h1>Samgrahaalaya</h1>

<div id="categoryHeader">
    Categories listed below
</div>
      

<div id="documentHeader">
    Documents listed for category highlighted above
</div>

<div id="pdfButtonContainer">
</div><div id="categoryButtons">

    <button
    id="btnCategoryA"
    class="category categoryA active">
    Vedam
</button>

<button
    id="btnCategoryB"
    class="category categoryB">
    Ashtottharam
</button>

<button
    id="btnCategoryC"
    class="category categoryC">
    Shlokam
</button>

<button
    id="btnCategoryD"
    class="category categoryD">
    Paaraayanam
</button>

</div>

<div id="pdfButtonContainer">

</div>


</body>

</html>
